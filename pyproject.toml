[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsync"
version = "0.1.0"
description = "Joint blind time-offset and unknown smooth graph-topology synchronization in asynchronous multi-sensor networks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Kang Liu", email = "peacekange@gmail.com" }
]
keywords = [
    "graph signal processing",
    "time synchronization",
    "graph learning",
    "spectral relaxation",
    "cramer-rao lower bound",
    "sensor networks",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
]

[project.scripts]
graphsync = "graphsync.cli:main"

[project.urls]
Homepage = "https://github.com/lucher777/graphsync"
Repository = "https://github.com/lucher777/graphsync"
Issues = "https://github.com/lucher777/graphsync/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphsync = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
